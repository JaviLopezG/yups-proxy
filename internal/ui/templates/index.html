<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUPS - Your Unified Proxy Service</title>
    <meta name="description" content="Access web content seamlessly via privacy-preserving and alternative proxies.">
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="YUPS - Your Unified Proxy Service">
    <meta property="og:description" content="Access web content seamlessly via privacy-preserving and alternative proxies.">
    <meta property="og:image" content="/static/logo.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="YUPS - Your Unified Proxy Service">
    <meta name="twitter:description" content="Access web content seamlessly via privacy-preserving and alternative proxies.">
    <meta name="twitter:image" content="/static/logo.png">

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/logo-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/logo-16.png">
    <link rel="icon" type="image/x-icon" href="/static/icons/favicon-32.ico">
    <link rel="apple-touch-icon" sizes="128x128" href="/static/icons/logo-128.png">

    <style>
        :root {
            --primary-brown: #EAB796;
            --detail-brown: #9E5A2E;
            --dark-brown: #4A2810;
            --bg-color: #FAF6F0;
            --card-bg: #FFFFFF;
            --text-color: #2D241E;
            --muted-text: #7D6B5D;
            --border-color: #E2D5C8;
            --shadow-sm: 0 2px 4px rgba(74, 40, 16, 0.06);
            --shadow-md: 0 4px 12px rgba(74, 40, 16, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 20px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            text-decoration: none;
        }

        .logo-img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .logo-img:hover {
            transform: scale(1.03);
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--detail-brown);
            margin-top: 10px;
        }

        .brand-tagline {
            font-size: 0.95rem;
            color: var(--muted-text);
            margin-top: 4px;
        }

        form {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.05rem;
            border: 2px solid var(--border-color);
            border-radius: 28px;
            background: var(--card-bg);
            color: var(--text-color);
            box-shadow: var(--shadow-sm);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--detail-brown);
            box-shadow: 0 0 0 4px rgba(158, 90, 46, 0.15);
        }

        .search-input::placeholder {
            color: #A8988B;
        }

        .buttons-row {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--primary-brown);
            color: var(--dark-brown);
            border-color: #D6A382;
        }

        .btn-primary:hover {
            background-color: #E2AA88;
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--detail-brown);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #F3EBE1;
            border-color: var(--detail-brown);
        }

        .hint-text {
            font-size: 0.85rem;
            color: var(--muted-text);
            margin-top: 20px;
            text-align: center;
            line-height: 1.4;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 18px 20px;
            font-size: 0.85rem;
            color: var(--muted-text);
            text-align: center;
            background-color: rgba(255, 255, 255, 0.5);
        }

        footer a {
            color: var(--detail-brown);
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        @media (max-width: 480px) {
            .logo-img {
                width: 120px;
                height: 120px;
            }
            .brand-title {
                font-size: 1.8rem;
            }
            .search-input {
                padding: 12px 16px;
                font-size: 0.95rem;
            }
            .buttons-row {
                width: 100%;
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <a href="/" class="logo-container">
            <img src="/static/logo.png" alt="YUPS Capybara Logo" class="logo-img">
            <h1 class="brand-title">YUPS</h1>
            <p class="brand-tagline">Your Unified Proxy Service</p>
        </a>

        <form action="/" method="GET">
            <div class="search-box">
                <input 
                    type="text" 
                    name="url" 
                    class="search-input" 
                    placeholder="Enter URL (e.g. x.com/..., reddit.com/..., or any page)" 
                    autofocus 
                    required
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>
            <div class="buttons-row">
                <button type="submit" name="action" value="lucky" class="btn btn-primary">I'm feeling lucky</button>
                <button type="submit" name="action" value="links" class="btn btn-secondary">Get proxy links</button>
            </div>
            <p class="hint-text">
                Pressing Enter triggers <strong>I'm feeling lucky</strong> and redirects immediately to a fast proxy mirror.
            </p>
        </form>
    </main>

    <footer>
        <div class="footer-links">
            <a href="https://github.com/javilopezg/yups-proxy" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
            <span>•</span>
            <a href="mailto:mail@javilopezg.com">mail@javilopezg.com</a>
            <span>•</span>
            <span>BSD-3-Clause License</span>
        </div>
        <div>
            YUPS • Accessible, open and privacy-respecting web aggregation
        </div>
    </footer>
</body>
</html>
